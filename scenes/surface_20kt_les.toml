# M1 variant of surface_20kt.toml with subgrid turbulence (Smagorinsky) switched on,
# to compare how the hot core mixes into the cap.
# From 1 s after detonation (fireball at ambient pressure) to one minute.
#
#   .\build\windows-ninja\nukesim.exe scenes\surface_20kt_les.toml
#
# GPU memory: about 4 GB at 256 x 256 x 384. For more detail try
# resolution = [320, 320, 480] with voxel_size = 12.8 (about 7 GB).

[scene]
name = "surface_20kt_les"
type = "fireball_rise"
device = "auto"
seed = 11

[grid]
resolution = [256, 256, 384]   # keep every axis divisible by 16 for the multigrid solver
voxel_size = 16.0              # m -> 4.1 x 4.1 x 6.1 km

[output]
dir = "out/surface_20kt_les"
prefix = "explosion"
fps = 24
fields = ["density", "temperature", "flame", "velocity"]
preview_every = 12
start_time = 1.0               # must not be earlier than fireball.start_time

# Test schedule: one frame every 0.25 s of simulated time (plays 6x faster than
# real time at 24 fps). The final slow-motion schedule comes with stage A (M4).
[[output.schedule]]
mode = "constant"
frames = 240
dt = 0.25

[atmosphere]
ground_altitude = 1200.0       # m above sea level
ground_temperature = 303.0     # K (30 C, desert)

[wind]
heading = 30.0                 # degrees from +X towards +Y (the direction it blows to)
profile = [[0.0, 1.5], [10.0, 2.0], [3000.0, 6.0], [10000.0, 8.0]]   # [height m, speed m/s]

[fireball]
start_time = 1.0               # s after detonation
radius = 200.0                 # m
center_height = 0.0            # surface burst
temperature = 4000.0           # K
edge_width = 0.3
noise_amplitude = 0.12
noise_frequency = 0.01
flame_temperature = 6000.0

[radiation]
absorption = 3e-4              # 1/m at reference_temperature
reference_temperature = 3000.0
exponent = 2.0

[solver]
cfl = 1.0
max_dt = 0.1
reflection = true
vorticity_confinement = 0.15
smagorinsky = 0.15             # subgrid turbulence constant (0 = off)
pressure_tolerance = 1e-4
