# M1 quick look: the buoyant phase of a ~20 kt surface burst at low resolution.
# Runs on a CPU in minutes; use scenes/surface_20kt.toml on the GPU for quality.
#
#   nukesim scenes/fireball_rise_preview.toml

[scene]
name = "fireball_rise_preview"
type = "fireball_rise"
device = "auto"
seed = 11

[grid]
resolution = [96, 96, 64]    # divisible by 16 (multigrid) and x, y by 4 (domain growth)
voxel_size = 12.5            # m -> 1.2 x 1.2 x 0.8 km at the start, doubles as the cloud grows

[output]
dir = "out/fireball_rise_preview"
prefix = "explosion"
fps = 24
fields = ["density", "dust", "temperature", "flame", "velocity"]
preview_every = 10
start_time = 1.0             # must not be earlier than fireball.start_time

[[output.schedule]]          # one frame every 0.5 s of simulated time
mode = "constant"
frames = 120
dt = 0.5

[atmosphere]
ground_altitude = 1200.0     # m above sea level
ground_temperature = 303.0   # K (30 C, desert)

[wind]
heading = 30.0               # degrees from +X towards +Y
profile = [[0.0, 1.5], [10.0, 2.0], [3000.0, 6.0], [10000.0, 8.0]]   # [height m, speed m/s]

[fireball]
start_time = 1.0             # s after detonation
radius = 200.0               # m
center_height = 0.0          # surface burst
temperature = 4000.0         # K
edge_width = 0.3
noise_amplitude = 0.12
noise_frequency = 0.01
flame_temperature = 6000.0

[radiation]
absorption = 3e-4            # 1/m at reference_temperature
reference_temperature = 3000.0
exponent = 2.0

[solver]
cfl = 1.0
max_dt = 0.25
reflection = true
vorticity_confinement = 0.15
smagorinsky = 0.15             # subgrid turbulent mixing (0 = off)
pressure_tolerance = 1e-4

[dust]
enabled = true
# Three size bins: fine (stays aloft, colours the cap), medium, coarse (falls back in curtains).
settling = [0.02, 0.4, 2.5]          # m/s terminal fall speed per bin
optical_weight = [1.0, 0.35, 0.1]    # how much each bin darkens the volume per unit mass
# Soil engulfed by the fireball (vaporised and pulverised at ground zero).
fireball_loading = 0.02              # kg dust per kg air
fireball_split = [0.5, 0.3, 0.2]
# Skirt of dust raised along the ground by the blast wave before t = 1 s.
skirt_radius = 700.0                 # m
skirt_height = 120.0                 # m at ground zero
skirt_loading = 0.01
skirt_split = [0.4, 0.45, 0.15]
# Sand lifted by the afterwind sucked in under the rising fireball (forms the stem).
erosion = 0.03                       # vertical dust flux coefficient (blast-driven, very high)
threshold_friction_velocity = 0.3    # m/s, loose desert sand
roughness_length = 0.001             # m
erosion_split = [0.3, 0.5, 0.2]
mass_loading = true                  # dust weighs the air down
render_scale = 100.0                 # exported "dust" grid = scale x optical dust concentration

[domain]
expand = true
trigger = 0.8
max_expansions = 4
