# M1: buoyant phase of a 20 kt surface burst in the desert, GPU resolution.
# From 1 s after detonation (fireball at ambient pressure) to one minute.
#
#   .\build\windows-ninja\nukesim.exe scenes\surface_20kt.toml
#
# The domain starts small and fine (5 m voxels: the fireball is ~40 voxels across its
# radius) and doubles whenever the cloud reaches 80 % of it: 5 -> 10 -> 20 -> 40 m.
# GPU memory: about 4.5 GB.

[scene]
name = "surface_20kt"
type = "fireball_rise"
device = "auto"
seed = 11

[grid]
resolution = [320, 320, 224]   # divisible by 16 (multigrid) and x, y by 4 (domain growth)
voxel_size = 5.0               # m -> 1.6 x 1.6 x 1.1 km at the start

[output]
dir = "out/surface_20kt"
prefix = "explosion"
fps = 24
fields = ["density", "dust", "condensate", "temperature", "flame", "velocity", "vorticity", "rest"]
preview_every = 12
start_time = 1.0               # must not be earlier than fireball.start_time

# Test schedule: one frame every 0.25 s of simulated time (plays 6x faster than
# real time at 24 fps). The final slow-motion schedule comes with stage A (M4).
[[output.schedule]]
mode = "constant"
frames = 240
dt = 0.25

[atmosphere]
ground_altitude = 1200.0       # m above sea level
ground_temperature = 303.0     # K (30 C, desert)

[wind]
heading = 30.0                 # degrees from +X towards +Y (the direction it blows to)
profile = [[0.0, 1.5], [10.0, 2.0], [3000.0, 6.0], [10000.0, 8.0]]   # [height m, speed m/s]

[fireball]
start_time = 1.0               # s after detonation
radius = 200.0                 # m
center_height = 0.0            # surface burst
temperature = 4000.0           # K
edge_width = 0.3
noise_amplitude = 0.12
noise_frequency = 0.01
flame_temperature = 6000.0

[radiation]
absorption = 3e-4              # 1/m at reference_temperature
reference_temperature = 3000.0
exponent = 2.0

[solver]
cfl = 1.0
max_dt = 0.1
reflection = true
vorticity_confinement = 0.15
smagorinsky = 0.1             # subgrid turbulent mixing (0 = off)
pressure_tolerance = 1e-4
turbulent_prandtl = 1.0        # scalar mixing weaker than momentum: sharper smoke
confinement_hot_boost = 1.5    # stronger small eddies in hot cloud gas (cauliflower surface)

[dust]
enabled = true
# Three size bins: fine (stays aloft, colours the cap), medium, coarse (falls back in curtains).
settling = [0.02, 0.4, 2.5]          # m/s terminal fall speed per bin
optical_weight = [1.0, 0.35, 0.1]    # how much each bin darkens the volume per unit mass
# Soil engulfed by the fireball (vaporised and pulverised at ground zero).
fireball_loading = 0.02              # kg dust per kg air
fireball_split = [0.5, 0.3, 0.2]
# Skirt of dust raised along the ground by the blast wave before t = 1 s.
skirt_radius = 700.0                 # m
skirt_height = 120.0                 # m at ground zero
skirt_loading = 0.01
skirt_split = [0.4, 0.45, 0.15]
# Sand lifted by the afterwind sucked in under the rising fireball (forms the stem).
erosion = 0.03                       # vertical dust flux coefficient (blast-driven, very high)
threshold_friction_velocity = 0.3    # m/s, loose desert sand
roughness_length = 0.001             # m
erosion_split = [0.3, 0.5, 0.2]
mass_loading = true                  # dust weighs the air down
render_scale = 100.0                 # exported "dust" grid = scale x optical dust concentration

[domain]
expand = true                  # double voxel size and domain when the cloud nears the edge
trigger = 0.8                  # fraction of the domain height / half-width
max_expansions = 4

[humidity]
enabled = true
# Relative humidity by height above the ground. Dry desert air at the ground (so no Wilson
# cloud), and a moist layer at 2.5-5 km that the rising cap pushes up into a white
# condensation cap and rings. For a dramatic Wilson cloud around the fireball set the
# lowest values to about 0.9 (physically unusual over a desert, but it looks great).
profile = [[0.0, 0.2], [1500.0, 0.3], [2500.0, 0.75], [3500.0, 0.95], [5000.0, 0.9], [6500.0, 0.4], [10000.0, 0.3]]
render_scale = 1000.0          # exported "condensate" = scale x cloud water concentration
